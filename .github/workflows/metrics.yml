name: Generate GitHub Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Updates automatically at midnight
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate unified metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Ophimacus
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila
          
          # Replaces github-readme-stats/top-langs
          plugin_languages: yes
          plugin_languages_limit: 8
          
          # Replaces github-readme-activity-graph
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Replaces github-profile-trophy
          plugin_achievements: yes
          plugin_achievements_display: compact
